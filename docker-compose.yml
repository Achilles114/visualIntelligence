services:
  edge-runtime:
    build:
      context: .
    image: visual-intelligence-platform
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - torch-cache:/root/.cache/torch

volumes:
  torch-cache: